<section class="exhibit"><div class="screen"><div class="photo-space" id="space"><div class="slide" id="slideA"><div class="blur"></div><img alt="Foto FKH UNAIR"></div><div class="slide" id="slideB"><div class="blur"></div><img alt="Foto FKH UNAIR"></div></div><div class="cover" id="cover"><div class="cover-inner"><p class="sunoCall">♫ &nbsp; PUTAR ALBUM KENANGAN</p><iframe id="suno" src="https://suno.com/embed/4434c6f3-6ed6-4309-9480-c38799ce75e6" title="Pemutar Menenun Asa di Suno" allow="autoplay;encrypted-media" loading="eager"></iframe><p class="play-instruction">Klik logo play <span aria-hidden="true">▶</span> untuk melihat album</p></div></div></div><div class="rolled" aria-label="Pita klise film 35 mm"><div class="film-track" id="filmtrack"></div></div><div class="nostalgia-caption">SATU ANGKATAN SEJUTA CERITA</div></section></main>
<script>
const photos=Array.from({length:16},(_,i)=>`foto/${String(i+1).padStart(2,'0')}.jpg`);
const $=id=>document.getElementById(id);let idx=0,active='A',playing=false,started=false,period=9000,timer=0,startTime=0,changing=false;
function strip(){photos.forEach((src,i)=>{const b=document.createElement('button');b.className='frame';b.dataset.number=String(i+1).padStart(2,'0');b.title='Foto '+(i+1);let img=document.createElement('img');img.src=src;img.loading='lazy';img.alt='Foto '+(i+1);b.append(img);b.onclick=()=>{if(!started)start();change(i)};$('filmtrack').append(b)})}
function paint(){let count=String(idx+1).padStart(2,'0')+' / 16';[...$('filmtrack').children].forEach((e,i)=>e.classList.toggle('selected',i===idx));const node=$('filmtrack').children[idx];if(node){const scroll=$('filmtrack');scroll.scrollTo({left:Math.max(0,node.offsetLeft+node.offsetWidth/2-scroll.clientWidth/2),behavior:'smooth'})}}
function loadImage(slot,src){return new Promise(resolve=>{const image=slot.querySelector('img');image.onload=resolve;image.onerror=resolve;image.src=src;slot.querySelector('.blur').style.backgroundImage=`url('${src}')`;if(image.complete)resolve()})}
async function change(i){if(changing)return;changing=true;const target=(i+photos.length)%photos.length;let next=active==='A'?'B':'A';await loadImage($('slide'+next),photos[target]);$('slide'+next).classList.add('active');$('slide'+active).classList.remove('active');active=next;idx=target;paint();clock();setTimeout(()=>changing=false,600)}
function clock(){clearTimeout(timer);startTime=performance.now();if(playing)timer=setTimeout(()=>change(idx+1),period)}
function state(){}
function start(){if(!started){started=true;playing=true;$('cover').classList.add('hidden');change(0);state()}else if(!playing){playing=true;clock();state()}}
function pause(){playing=false;clearTimeout(timer);state()}
let lastFocus=false;function check(){let focus=document.activeElement===$('suno');if(focus&&!lastFocus&&!started)start();lastFocus=focus}
window.addEventListener('blur',()=>setTimeout(check,80));window.addEventListener('focus',check);setInterval(check,350);







strip();paint();
</script></body></html>
